<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
 <defs>
 <!-- Dark Metallic Gradient for subtle depth instead of flat black -->
 <linearGradient id="darkMetalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
   <stop offset="0%" stop-color="#2C2C2C" />
   <stop offset="50%" stop-color="#0A0A0A" />
   <stop offset="100%" stop-color="#1F1F1F" />
 </linearGradient>
</defs>

<!-- Transparent Background -->

<!-- Geometric Starlines (Thicker, Dark Gray) -->
<g stroke="#333333" stroke-width="3" stroke-linecap="round" opacity="0.8">
 <line x1="400" y1="80" x2="400" y2="220" />
 <line x1="400" y1="580" x2="400" y2="720" />
 <line x1="80" y1="400" x2="220" y2="400" />
 <line x1="580" y1="400" x2="720" y2="400" />
 <line x1="170" y1="170" x2="260" y2="260" />
 <line x1="540" y1="540" x2="630" y2="630" />
 <line x1="630" y1="170" x2="540" y2="260" />
 <line x1="260" y1="540" x2="170" y2="630" />
</g>

<!-- Sleek Framing (All Black/Dark) -->
<g fill="none" stroke-linejoin="round">
 <!-- Outer Ring -->
 <circle cx="400" cy="400" r="350" stroke="#0A0A0A" stroke-width="6" />
 <!-- Inner Ring -->
 <circle cx="400" cy="400" r="330" stroke="#1A1A1A" stroke-width="8" />
 <!-- Accent Ring -->
 <circle cx="400" cy="400" r="318" stroke="#0A0A0A" stroke-width="3" opacity="0.9" />
 
 <!-- Simplified Notches (Just lines, no triangles) -->
 <line x1="400" y1="50" x2="400" y2="70" stroke="#0A0A0A" stroke-width="4" />
 <line x1="400" y1="730" x2="400" y2="750" stroke="#0A0A0A" stroke-width="4" />
 <line x1="50" y1="400" x2="70" y2="400" stroke="#0A0A0A" stroke-width="4" />
 <line x1="730" y1="400" x2="750" y2="400" stroke="#0A0A0A" stroke-width="4" />
</g>

<!-- Typography: R I B (Thicker Strokes: 9px, Pure Black Outline Only) -->
<g fill="none" stroke="#0A0A0A" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
 <!-- Letter R -->
 <path d="
  M 180 520 L 180 280 L 250 280 C 290 280, 300 310, 300 340 C 300 370, 290 400, 250 400 L 210 400
  M 210 280 L 210 400
  M 250 400 C 280 400, 295 385, 295 355 C 295 325, 280 310 , 250 310
  M 230 400 L 280 520
 " />

 <!-- Letter I Stylized as ][ -->
 <path d="
  M 350 280 L 370 280 L 370 300 L 360 300 L 360 500 L 370 500 L 370 520 L 350 520
  M 450 280 L 430 280 L 430 300 L 440 300 L 440 500 L 430 500 L 430 520 L 450 520
 " />

 <!-- Letter B -->
 <path d="
  M 540 520 L 540 280 L 610 280 C 650 280, 660 310, 660 340 C 660 365, 645 385, 620 395 C 655 405, 670 430, 670 465 C 670 500, 655 520, 610 520 Z
  M 570 280 L 570 395
  M 570 395 L 570 520
  M 610 280 C 635 280, 640 300, 640 330 C 640 360, 635 380, 610 380
  M 610 395 C 640 395, 650 420, 650 455 C 650 490, 640 510, 610 510
 " />
</g>

<!-- Simplified Geometric Accents (Just bars between letters, no dots) -->
<g fill="none" stroke="#0A0A0A" stroke-width="5" stroke-linecap="round" opacity="1">
 <line x1="295" y1="340" x2="335" y2="340" />
 <line x1="465" y1="340" x2="505" y2="340" />
 <line x1="295" y1="460" x2="335" y2="460" />
 <line x1="465" y1="460" x2="505" y2="460" />
</g>

</svg>