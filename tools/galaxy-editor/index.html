<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Редактор галактики</title><link rel="stylesheet" href="/style.css"><body>
<header><strong>Галактический атлас</strong><button id="save">Сохранить в игру</button><button id="export">Экспорт JSON</button><label class="button">Импорт JSON<input id="import" type="file" accept=".json,application/json" hidden></label><button id="undo">↶</button><button id="redo">↷</button><span id="status">Загрузка…</span></header>
<main><aside><label>Объекты<select id="collection"><option value="systems">Системы</option><option value="pois">Точки интереса</option><option value="factions">Государства</option><option value="territories">Границы</option><option value="links">Гиперсвязи</option></select></label><select id="objects" size="12"></select><div class="row"><button id="add">Добавить</button><button id="delete">Удалить</button></div><p>ЛКМ — выбор и перемещение точек. На пустом месте — перемещение карты. Колесо — масштаб.</p><p>Для границ и изгибов: «Рисовать» и кликай по карте. Shift + движение — свободная линия. Enter — завершить. Escape — отменить.</p></aside>
<section id="view"><svg id="map" aria-label="Карта галактики"></svg><nav><button id="plus" title="Приблизить">+</button><button id="minus" title="Отдалить">−</button><button id="fit">Вся карта</button><button id="draw">Рисовать</button></nav><footer id="coords"></footer></section><aside id="inspector"></aside></main>
<script type="module" src="/app.mjs"></script></body></html>
