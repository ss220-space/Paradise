=/obj/structure/cable:
  banned_neighbors:
    - /obj/structure/cable
  ignore:
    - /obj/structure/cable/layer1
    - /obj/structure/cable/layer3

/obj/structure/cable/layer1:
  banned_neighbors:
    - /obj/structure/cable/layer1
    - /obj/structure/cable/multilayer
  ignore:
    - /obj/structure/cable
    - /obj/structure/cable/layer3

/obj/structure/cable/layer3:
  banned_neighbors:
    - /obj/structure/cable/layer3
    - /obj/structure/cable/multilayer
  ignore:
    - /obj/structure/cable
    - /obj/structure/cable/layer1

/obj/structure/cable/multilayer:
  banned_neighbors:
    - /obj/structure/cable
