on:
  workflow_call:
    inputs:
      major:
        required: true
        type: string
      minor:
        required: true
        type: string

jobs:
  setup_build_artifact:
    name: Setup build artifact (${{ format('{0}.{1}', inputs.major, inputs.minor) }})
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Restore BYOND from Cache
        uses: ./.github/actions/restore_or_install_byond
        with:
          major: ${{ inputs.major }}
          minor: ${{ inputs.minor }}

      - name: Install RUST_G Deps
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update || true
          sudo apt install libgcc-s1:i386
          bash tools/ci/install_rustg.sh

      - name: Install DMJIT
        run: |
          sudo apt install libncurses6:i386
          bash tools/ci/install_dmjit.sh

      - name: Compile
        run: |
          source $HOME/BYOND/byond/bin/byondsetup
          tools/ci/dm.sh -DCIBUILDING paradise.dme

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact-${{ inputs.major }}-${{ inputs.minor }}
          path: .
          retention-days: 1
