name: AI PR Description
on:
  pull_request_target:
    types: [opened, labeled]
permissions:
  contents: read
  pull-requests: write
  issues: write
concurrency:
  group: ai-pr-description-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  ai_pr_description:
    runs-on: ubuntu-24.04
    if: github.event.action == 'opened' || github.event.label.name == 'AI описание'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Fill PR description
        uses: actions/github-script@v9
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
        with:
          script: |
            const { fillPullRequestDescription } = await import('${{ github.workspace }}/tools/pull_request_hooks/aiDescription.js')
            await fillPullRequestDescription({ github, context })
