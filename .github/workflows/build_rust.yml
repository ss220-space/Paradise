name: Build Rust library
on:
  issue_comment:
    types: created

jobs:
  build-rust:
    if: |
      github.event.issue.pull_request &&
      github.event.comment.body == '!build_rust' &&
      (github.event.sender.id == github.event.issue.user.id ||
       github.event.comment.author_association == 'COLLABORATOR' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'OWNER')

    runs-on: ubuntu-latest
    steps:
      - id: create_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - run: echo "GH_TOKEN=${{ steps.create_token.outputs.token }}" >> "$GITHUB_ENV"

      - name: Like the comment
        env:
          BASE_REPOSITORY: ${{ github.repository }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/$BASE_REPOSITORY/issues/comments/${{ github.event.comment.id }}/reactions \
            -f content='+1'

      - name: Check PR Permissions
        run: |
          pr_json=$(curl -L -s --fail-with-body -H "Authorization: token ${{ github.token }}" ${{ github.event.issue.pull_request.url }})
          if [ `jq -r '.maintainer_can_modify' <<<$pr_json` == "false" ]; then
            gh pr comment ${{ github.event.issue.html_url }} --body 'GitHub Actions cannot push to the repository without "Allow edits and access to secrets by maintainers" checked.'
            exit 1
          fi
          echo "PR_REPO=`jq -r '.head.repo.full_name' <<<$pr_json`" >> $GITHUB_ENV
          echo "PR_BRANCH=`jq -r '.head.ref' <<<$pr_json`" >> $GITHUB_ENV

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.PR_REPO }}
          ref: ${{ env.PR_BRANCH }}
          token: ${{ env.GH_TOKEN }}
          fetch-depth: 1

      - name: Build rustlibs
        env:
          GH_TOKEN: ${{ env.GH_TOKEN }}
        run: |
          # Configure git for committing
          git config --local user.email "action@github.com"
          git config --local user.name "Rust builder"

          # Install dependencies
          rustup target add i686-unknown-linux-gnu i686-pc-windows-gnu
          sudo dpkg --add-architecture i386
          sudo apt-get update && sudo apt-get install -y zlib1g-dev:i386 lib32gcc-11-dev mingw-w64 mingw-w64-i686-dev

          # Build Rust libraries
          cd rust
          cargo build --release --target i686-unknown-linux-gnu
          cargo build --release --target i686-pc-windows-gnu

          # Copy artifacts
          cp target/i686-unknown-linux-gnu/release/librustlibs.so ../tools/ci/librustlibs_ci.so
          cp target/i686-unknown-linux-gnu/release/librustlibs.so ../librustlibs.so
          cp target/i686-pc-windows-gnu/release/rustlibs.dll ../rustlibs.dll

          # Commit and push
          git commit -a -m "Build Rust library" --allow-empty
          git push origin

      - name: Notify Failure
        if: failure()
        run: |
          gh pr comment ${{ github.event.issue.html_url }} -b 'Building Rust library failed, see the action run log for details: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
