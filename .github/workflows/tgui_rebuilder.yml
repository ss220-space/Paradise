name: TGUI Auto-Rebuild on Public Conflicts

on:
  pull_request_target:
    types: [ready_for_review, opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  check-and-rebuild:
    if: |
      github.event_name == 'pull_request_target' ||
      (ithub.event.issue.pull_request && github.event_name == 'issue_comment' && contains(github.event.comment.body, '/rebuild-tgui'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Delete the command comment
        if: contains(github.event.comment.body, '/rebuild-tgui')
        uses: actions/github-script@v6
        with:
          script: |
            await github.rest.issues.deleteComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id
            })
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha}}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'
          cache-dependency-path: ./tgui/yarn.lock

      - name: Fetch target branch (e.g., master220)
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}

      - name: Check merge conflicts in tgui/public
        id: check-conflicts
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "TGUI Auto-Rebuild"
          if [ -f ".git/MERGE_HEAD" ]; then
            git merge --abort
          fi

          git merge --no-commit --no-ff origin/${{ github.event.pull_request.base.ref}} || true

          echo ${{ github.event.pull_request.base.ref }}
          
          CONFLICT_FILES=$(git diff --name-only --diff-filter=U)
          echo "Conflicted files: $CONFLICT_FILES"

          BAD_CONFLICTS=0
          for FILE in $CONFLICT_FILES; do
            if [[ "$FILE" != "tgui/public/"* || "$FILE" == "tgui/public/tgui.html" ]]; then
              echo "Invalid conflict: $FILE"
              BAD_CONFLICTS=1
              break
            fi
          done

          if [ "$BAD_CONFLICTS" -eq 0 ] && [ -n "$CONFLICT_FILES" ]; then
            echo "safe_to_rebuild=true" >> $GITHUB_ENV
          else
            if [ "$BAD_CONFLICTS" -eq 1 ]; then
              echo "safe_to_rebuild=false" >> $GITHUB_ENV
            fi
          fi
          if [ -f ".git/MERGE_HEAD" ]; then
            git merge --abort
          fi

      - name: Rebuild TGUI (if safe)
        if: env.safe_to_rebuild == 'true'
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "TGUI Auto-Rebuild"

          git merge --no-commit --no-ff origin/${{ github.event.pull_request.base.ref}} || true

          cd tgui/public
          find . -type f -not -name 'tgui.html' -delete
          find . -type d -not -name '.' -exec rm -rf {} +
          cd ../..

          ./tgui/bin/tgui

          git add tgui/public
          git commit -m "Auto-rebuild TGUI after conflicts"
          git push

      - name: Comment on PR (if rebuilt)
        if: env.safe_to_rebuild == 'true'
        run:
          echo '🔧 Конфликты успешно решены при пересборке tgui!'

      - name: Comment on PR (if unsafe conflicts)
        if: env.safe_to_rebuild == 'false'
        run:
          echo '⚠️ Обнаружены конфликты за пределами `tgui/public` или в `tgui.html`. Нельзя автоматически пересобрать TGUI. Разрешите конфликты вручную.'
