name: Compile changelogs

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

jobs:
  compile:
    name: "Compile changelogs"
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: "Check for ACTION_ENABLER secret and pass true to output if it exists to be checked by later steps"
        id: value_holder
        env:
          ENABLER_SECRET: ${{ secrets.ACTION_ENABLER }}
        run: |
          unset SECRET_EXISTS
          if [ -n "$ENABLER_SECRET" ]; then SECRET_EXISTS=true ; fi
          echo "ACTIONS_ENABLED=$SECRET_EXISTS" >> $GITHUB_OUTPUT

      - name: "Setup python"
        if: steps.value_holder.outputs.ACTIONS_ENABLED
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: "Install deps"
        if: steps.value_holder.outputs.ACTIONS_ENABLED
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: "Checkout"
        if: steps.value_holder.outputs.ACTIONS_ENABLED
        uses: actions/checkout@v7
        with:
          fetch-depth: 25
          persist-credentials: false
          ref: master220

      - name: "Compile"
        if: steps.value_holder.outputs.ACTIONS_ENABLED
        run: |
          python tools/ss13_genchangelog.py html/changelogs

      - name: Commit
        id: commit
        if: steps.value_holder.outputs.ACTIONS_ENABLED
        run: |
          git config --local user.name "Changelog Generation"
          git config --local user.email "action@github.com"
          git add html/changelogs
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git switch -c automation/compile-changelogs
          git commit -m "Compile changelogs"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Generate App Token
        id: app-token-generation
        uses: actions/create-github-app-token@v3.2.0
        if: steps.commit.outputs.has_changes == 'true' && env.APP_PRIVATE_KEY != '' && env.APP_ID != ''
        with:
          client-id: ${{ secrets.CHANGELOGBOT_APPID }}
          private-key: ${{ secrets.CHANGELOGBOT_PRIVATEKEY }}
        env:
          APP_PRIVATE_KEY: ${{ secrets.CHANGELOGBOT_PRIVATEKEY }}
          APP_ID: ${{ secrets.CHANGELOGBOT_APPID }}

      - name: Open changelog pull request
        if: steps.commit.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token-generation.outputs.token || secrets.CHANGELOGBOT_TOKEN || github.token }}
        run: |
          gh auth setup-git
          git fetch origin automation/compile-changelogs:refs/remotes/origin/automation/compile-changelogs || true
          git push --force-with-lease --set-upstream origin automation/compile-changelogs
          if [ "$(gh pr list --head automation/compile-changelogs --base master220 --state open --json number --jq 'length')" = "0" ]; then
            gh pr create --base master220 --head automation/compile-changelogs \
              --title "Compile changelogs" \
              --body "Automatically compiled changelogs. Review and merge this pull request."
          fi
