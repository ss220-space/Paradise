name: Deploy Main

on:
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  ci:
    name: Verify build
    uses: ./.github/workflows/ci_suite.yml

  deploy:
    name: Build on TGServer
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: Main
    steps:
      - name: Update and compile on TGServer
        env:
          DEPLOY_BRANCH: ${{ vars.BRANCH }}
          DEPLOY_HOST: ${{ vars.PRODUCTION_HOST }}
          DEPLOY_PORT: ${{ vars.PRODUCTION_PORT }}
          DEPLOY_USER: ${{ vars.PRODUCTION_USER }}
          DEPLOY_HOST_KEY: ${{ vars.PRODUCTION_HOST_KEY }}
          DEPLOY_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
        run: |
          set -euo pipefail
          : "${DEPLOY_BRANCH:?Missing BRANCH}"
          : "${DEPLOY_HOST:?Missing PRODUCTION_HOST}"
          : "${DEPLOY_PORT:?Missing PRODUCTION_PORT}"
          : "${DEPLOY_USER:?Missing PRODUCTION_USER}"
          : "${DEPLOY_HOST_KEY:?Missing PRODUCTION_HOST_KEY}"
          : "${DEPLOY_SSH_KEY:?Missing PRODUCTION_SSH_KEY}"
          if [[ "$GITHUB_REF_NAME" != "$DEPLOY_BRANCH" ]]; then
            echo "Deployments are limited to $DEPLOY_BRANCH" >&2
            exit 1
          fi

          ssh_dir=$(mktemp -d)
          trap 'rm -f "$ssh_dir/key" "$ssh_dir/known_hosts"; rmdir "$ssh_dir"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_HOST_KEY" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          ssh -F /dev/null \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=10 \
            -i "$ssh_dir/key" \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy $GITHUB_SHA"
