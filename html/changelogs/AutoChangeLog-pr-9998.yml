author: "SCPfollower"
delete-after: True
changes:
  - map: "Решетка в техах ботаники на Дельте не бьет током. (PR #9998)"
  - map: "Поставлен провод под солнечную панель на Дельте. (PR #9998)"
  - bugfix: "Убрана возможность драться в красном захвате от гаротки и БИ безоружного боя. (PR #9998)"
  - bugfix: "Исправлена невозможность засовывать магазины в поучи если они в кармане/сумке. (PR #9998)"
  - bugfix: "Исправлено удвоение сбора растений с грядки, если собирают двое в один момент. (PR #9998)"
  - bugfix: "Исправлен телепорт удаленного легиона при призыве прирученной фауны цветком с Лавы. (PR #9998)"
  - bugfix: "Исправлена возможность перемещаться с геном невидимости не сбивая эту самую невидимость. (PR #9998)"