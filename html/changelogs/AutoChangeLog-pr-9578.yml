author: "dageavtobusnick"
delete-after: True
changes:
  - bugfix: "Исправлена возможная причина потери навыков при клонировании. (PR #9578)"
  - bugfix: "Теперь при перемещении майнда в не хумана навыки сохраняются, но не передаются не хуману. Они сохранятся и будут возвращены, когда майнд вернется в хумана. (PR #9578)"
  - bugfix: "Теперь при получении потери датумизированного антага происходит сброс и перерасчет навыков. Эффекты нейротрейнеров и прочитанных мануалов сохраняются(если моб - хуман) (PR #9578)"
  - bugfix: "Исправлено некорректное поведение рцд при клике по рюказаку в инвентаре. (PR #9578)"