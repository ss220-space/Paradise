author: "dageavtobusnick"
delete-after: True
changes:
  - add: "Добавлен новый вирус - Кровавая чума. (PR #9948)"
  - add: "В список вирусов в ивенте вирусной угрозы добавлены: Некротизирующая чумы, Кровавая чума и ГБС. (PR #9948)"
  - del: "Обопщена старая(гуновская и новая нулификация вампиров в сторону новой. Всем вампирам возвращена уязвимость к чесноку, сгорание в космосе и особые эффекты от некоторых вариантов нулрода. (PR #9948)"
  - tweak: "Добавлена невозможность использовать модули МЭК при наличии серьезного повреждения мозга(в том числе и зомби вируса) (PR #9948)"
  - tweak: "Добавлен серьезный разброс у оружия при наличии серьезного повреждения мозга(в том числе и зомби вируса) (PR #9948)"
  - balance: "Заражать когтями зомби теперь могут в любую часть тела (PR #9948)"
  - balance: "Укус зомби теперь работает в любом грабе (PR #9948)"
  - tweak: "Вампиры теперь могут заражаться вирусами(передающимися через кровь) при питье крови (PR #9948)"
  - tweak: "Вампиры теперь заражают вирусами, передающимися через кровь или укусы, при использовании когтей гемомансера (PR #9948)"
  - balance: "Произошёл небольшой ап живучисти и скорости танка(не до донерфовских и близко) (PR #9948)"
  - balance: "Зомби Тени возвращена частичная прозрачность(не донерфовская и близко), более сильная все еще наступает в темноте (PR #9948)"
  - balance: "Ослаблена кислота зомби Плевуна (PR #9948)"
  - bugfix: "Исправлен неработающий рывок у охотника. (PR #9948)"