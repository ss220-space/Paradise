author: "KINGDICE666"
delete-after: True
changes:
  - add: "Добавлены новые звуки подбора и броска для множества предметов, включая дубинки, сигареты, столовые приборы, дверные пульты, экипировку, сумки с доказательствами, противогазы, очки, защитные очки, каски и другие. (PR #110)"
  - tweak: "Для многих предметов добавлен флаг sound_vary, позволяющий воспроизводить звуки с небольшими вариациями высоты тона. (PR #110)"
  - add: "Определены новые ключи звуковых эффектов, объединяющие несколько вариантов звуков для одного события (подбор, бросок, экипировка и т.д.). (PR #110)"
  - config: "Изменена конфигурация по умолчанию: анимации подбора предметов теперь включены. (PR #110)"
  - tweak: "Механика броска предметов обновлена: при наличии отдельного звука throw_drop_sound он используется вместо обычного звука падения. (PR #110)"