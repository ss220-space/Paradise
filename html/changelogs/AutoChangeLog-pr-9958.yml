author: "dageavtobusnick"
delete-after: True
changes:
  - add: "Добавлены концовка режима зомби и промежуточные директивы. (PR #9958)"
  - bugfix: "Исправлена возможная причина перехвата управления у игрока у ИИ у зомби (PR #9958)"
  - balance: "Увеличено время лечения от вампировируса. Теперь к вампировирусу нельзя выработать иммунитет. (PR #9958)"
  - bugfix: "Исправлена возможность для зомби выкручивать лампочки (PR #9958)"
  - bugfix: "Исправлено лечение вампировируса у вирусных вампиров при получении полной силы (PR #9958)"
  - bugfix: "Укусы симпл мобов бестии теперь могут передавать вирусы (PR #9958)"
  - balance: "Ослаблен урон по зомби-Охотнику. (PR #9958)"
  - balance: "Незначительно ослаблен урон по стамине у всех зомби. (PR #9958)"
  - balance: "Незначительно увеличен КД у абилки дыма. (PR #9958)"
  - balance: "Переработан кислотный плевок в целях уменьшения его токсичности. (PR #9958)"
  - balance: "Теперь библии, которые печатаются в библиотеке не имеют антимагию. Они могут получить ее на 10 минут, если священник ударит по ней другой библией. (PR #9958)"