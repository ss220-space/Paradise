author: "KINGDICE666"
delete-after: True
changes:
  - add: "Добавлены новые логистические трубы (прямые, изогнутые, тройники, Y‑образные и магистральные), которые можно класть с помощью RPD. (PR #108)"
  - add: "Добавлена плата логистического интерфейса для подключения совместимой техники к логистической сети и переключения режима отправки/приёма. (PR #108)"
  - add: "Добавлена центральная консоль логистики (logistics core console) для управления сетями, запросами и архивами. (PR #108)"
  - add: "Добавлен умный контейнер (smart container) как улучшение smartfridge с встроенным логистическим интерфейсом. (PR #108)"
  - add: "Автолате, мехфабрика и умный холодильник теперь могут быть wyposażены логистическим интерфейсом. (PR #108)"
  - add: "Множество стеков‑предметов теперь учитывают своё количество в логистике (аммиачные кристаллы, прутья, листы, телекристаллы, кредиты, чипы и др.). (PR #108)"