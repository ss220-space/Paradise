author: "dageavtobusnick"
delete-after: True
changes:
  - bugfix: "Исправлено расположения файралярма у старого СМ. (PR #10121)"
  - tweak: "Лазерные глаза переделаны на спелл экшен. Спелл экшены, стреляющие проджектайлами получили поддержку импланта прицеливания. (PR #10121)"
  - bugfix: "Исправлена невозможность открыть меню проводов у suit_storage_unit кусачками и мультитулом. (PR #10121)"
  - bugfix: "Исправлен вечный дельта код при удалении малф ии с думсдейдевайсом. (PR #10121)"
  - bugfix: "Исправлено вечное КД у хамелеон проектора. (PR #10121)"
  - bugfix: "Исправлено неверное отображение цвета у некоторых генов в планшете генетика. (PR #10121)"
  - bugfix: "Исправлено отсутствие проверки валидности цели у миномета перед выстрелом. (PR #10121)"
  - bugfix: "Исправлено отсутствие перемещение контейнера вместе с содержимым при выкладывании содержимого на стол. (PR #10121)"
  - bugfix: "Исправлена невозможность повесить мешок для мусора на тележки уборщика. (PR #10121)"
  - bugfix: "Исправлены различные возможные проблемы в взаимодействии с тележками уборщика. (PR #10121)"
  - bugfix: "Исправлена невозможность выложить в мусорку содержимое контейнеров. Теперь это делается на ПКМ. (PR #10121)"
  - bugfix: "Опьянение от вин на основе гороха и его производных снижено в 100 раз. При порте его забыли перевести в изменения нашего билда. (PR #10121)"
  - bugfix: "Исправлено отсутствие прерывания прогресс бара при перемещении предмета в инвентаре, там где это должно прерываться (PR #10121)"
  - bugfix: "Исправлено отсутствие установки имплантов в глаза и в язык при пришивании отрубленной головы (PR #10121)"
  - bugfix: "Лечение змеи от мышей исправлено на более корректное. Это могло вызывать некоторые баги, о которых сообщали в репорте, но возможно там просто было обновление с задержкой (PR #10121)"
  - code_imp: "Добелены дополнительные очистки ссылок и удаления объектов при удалении ИИ (PR #10121)"
  - bugfix: "Исправлено некорректное добавление предметов культа Ратвара в манипулятор скоробея Ратвара, из-за чего тот не мог с ними взаимодействовать (PR #10121)"
  - bugfix: "Исправлено исчезновение модулей при улучшении зюзяпушек (PR #10121)"
  - bugfix: "Исправлена некорректная работа меню стабилизатора аномалий (PR #10121)"
  - bugfix: "Исправлено отсутствие уклонения от пуль при передозировке реагентом сандевистана (PR #10121)"
  - bugfix: "Исправлена проблема, из-за которой гранаты с черным порохом не взрывались (PR #10121)"
  - tweak: "Экшены, стреляющие проджектайлами получили поддержку зон прицеливания (PR #10121)"
  - bugfix: "Имплант системы взлома больше не стреляет лучем в 1 1 1 при клике на предмет в инвентаре (PR #10121)"
  - code_imp: "Немного оптимизирован расход памяти органами (PR #10121)"
  - bugfix: "Исправлена невозможность создания новостного канала (PR #10121)"
  - balance: "Повышена цена на снаряды миномета и миномет (PR #10121)"
  - balance: "Понижен урон моноструны (PR #10121)"
  - balance: "Уменьшена дальность системы взлома (PR #10121)"