author: "KINGDICE666"
delete-after: True
changes:
  - bugfix: "Исправлен NTnetFIX (PR #94). (PR #116)"
  - add: "Добавлены новые звуки подбора и броска для множества предметов, включая дубинки, сигареты, столовые приборы, дверные пульты, экипировку, сумки с доказательствами, противогазы, очки, защитные очки, каски и другие. (PR #110). (PR #116)"
  - tweak: "Для многих предметов добавлен флаг sound_vary, позволяющий воспроизводить звуки с небольшими вариациями высоты тона. (PR #110). (PR #116)"
  - add: "Определены новые ключи звуковых эффектов, объединяющие несколько вариантов звуков для одного события (подбор, бросок, экипировка и т.д.). (PR #110). (PR #116)"
  - config: "Изменена конфигурация по умолчанию: анимации подбора предметов теперь включены. (PR #110). (PR #116)"
  - tweak: "Механика броска предметов обновлена: при наличии отдельного звука throw_drop_sound он используется вместо обычного звука падения. (PR #110). (PR #116)"
  - qol: "Сделано более простым в использовании NTnet через PDA за счёт добавления поддержки зеркал русскоязычной вики. (PR #97). (PR #116)"
  - qol: "Окно выбора предпочитаемых должностей переделано в стиле TG: приоритет выбирается одним кликом по цветной кнопке, причина недоступности должности видна сразу. (PR #93). (PR #116)"
  - refactor: "Окно выбора должностей переведено с HTML на tgui. (PR #93). (PR #116)"
  - add: "Добавлен админ-верб для смены состояния спрайта у атомов и загрузки новых .dmi-файлов. (PR #99). (PR #116)"
  - qol: "Мобы получают действие «Сменить спрайт» после загрузки нового спрайта, позволяя переключать состояния без админ-верба. (PR #99). (PR #116)"
  - add: "Это в целом круто! (PR #89). (PR #116)"
  - qol: "Сделано более простым в использовании NTnet через PDA за счёт добавления поддержки зеркал русскоязычной вики. (PR #103). (PR #116)"
  - add: "БД для НТнета добавлена. (PR #90). (PR #116)"
  - bugfix: "НТнет починён. (PR #92). (PR #116)"
  - add: "AI добавлен. (PR #98). (PR #116)"